<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Akhir lembar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Andika:wght@400;700&display=swap">
<style>
body { margin: 0; }
a { color: #1F7A4D; } a:hover { color: #15502F; }
button { cursor: pointer; }
</style>
</helmet>
<div style="width: 360px; height: 800px; box-sizing: border-box; background: #FFF6E5; font-family: 'Andika', sans-serif; color: #2D3142; display: flex; flex-direction: column; padding: 20px 16px 24px; gap: 14px; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 12px;">
    <svg width="104" height="104" viewBox="0 0 120 120" role="img" aria-label="Pinci merayakan" style="flex: none;">
      <ellipse cx="30" cy="24" rx="16" ry="22" fill="#A0673A" stroke="#6B4423" stroke-width="3"/>
      <ellipse cx="90" cy="24" rx="16" ry="22" fill="#A0673A" stroke="#6B4423" stroke-width="3"/>
      <ellipse cx="30" cy="26" rx="8" ry="12" fill="#FFF6E5"/>
      <ellipse cx="90" cy="26" rx="8" ry="12" fill="#FFF6E5"/>
      <circle cx="60" cy="68" r="46" fill="#A0673A" stroke="#6B4423" stroke-width="3"/>
      <ellipse cx="60" cy="86" rx="30" ry="22" fill="#FFF6E5"/>
      <path d="M40 54 L48 48" stroke="#6B4423" stroke-width="3" stroke-linecap="round"/>
      <path d="M80 54 L72 48" stroke="#6B4423" stroke-width="3" stroke-linecap="round"/>
      <path d="M40 60 Q46 50 52 60" fill="#FFFFFF" stroke="#6B4423" stroke-width="2"/>
      <path d="M68 60 Q74 50 80 60" fill="#FFFFFF" stroke="#6B4423" stroke-width="2"/>
      <path d="M44 86 Q60 112 76 86 Q60 100 44 86 Z" fill="#6B4423"/>
      <path d="M14 20 l4 10 l-10 -2 z" fill="#FF9F1C"/>
      <path d="M106 18 l-4 10 l10 -2 z" fill="#3BB273"/>
      <circle cx="10" cy="50" r="3" fill="#E85D5D"/>
      <circle cx="112" cy="52" r="3" fill="#3A86FF"/>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 36px; line-height: 1.05; color: #1F7A4D;">Selesai!</h1>
      <div style="font-size: 16px; color: #5B6072;">Lancar Matematika · Level 3</div>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 6px rgba(45,49,66,0.08);">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-size: 40px; font-weight: 700; line-height: 1;">19</span>
      <span style="font-size: 20px;">dari 20 benar</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 18px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="13" r="8" stroke="#2D3142" stroke-width="2"/><path d="M12 9v4l2.5 2M9 2h6" stroke="#2D3142" stroke-width="2" stroke-linecap="round"/></svg>
      1 menit 12 detik
    </div>
    <div style="align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: #FFF0D9; font-size: 16px; font-weight: 700;">Rekor baru! (tadi 1:31)</div>
    <div style="display: flex; gap: 16px; font-size: 14px; color: #1F7A4D; font-weight: 700;">
      <span>Tersimpan ✓</span>
      <span>Terkirim ✓✓</span>
    </div>
  </div>

  <div style="font-size: 18px; font-weight: 700; line-height: 1.3;">Latihan tadi rasanya seperti hewan apa?</div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
    <sc-for list="{{ moods }}" as="m" hint-placeholder-count="4">
      <sc-if value="{{ m.on }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ m.pick }}" aria-pressed="true" style="height: 88px; border-radius: 16px; background: #E4F4EB; border: 3px solid #3BB273; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: 'Andika', sans-serif; color: #2D3142; font-weight: 700;">
          <span style="font-size: 32px; line-height: 1;">{{ m.emoji }}</span>
          <span style="font-size: 15px; line-height: 1.2;">{{ m.label }}</span>
        </button>
      </sc-if>
      <sc-if value="{{ m.off }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ m.pick }}" aria-pressed="false" style="height: 88px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EDE3CF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: 'Andika', sans-serif; color: #2D3142;">
          <span style="font-size: 32px; line-height: 1;">{{ m.emoji }}</span>
          <span style="font-size: 15px; line-height: 1.2;">{{ m.label }}</span>
        </button>
      </sc-if>
    </sc-for>
  </div>

  <div style="flex: 1;"></div>
  <a href="A03-Beranda-Belajar.dc.html" style="height: 64px; border-radius: 16px; background: #3BB273; color: #2D3142; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; box-shadow: 0 2px 6px rgba(45,49,66,0.12);">Kembali ke beranda</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null };
  }
  renderVals() {
    const list = [
      { id: 'burung', emoji: '🐦', label: 'Burung terbang' },
      { id: 'rusa', emoji: '🦌', label: 'Rusa lincah' },
      { id: 'penyu', emoji: '🐢', label: 'Penyu pelan' },
      { id: 'gajah', emoji: '🐘', label: 'Gajah ngantuk' }
    ];
    return {
      moods: list.map((m) => {
        const on = this.state.picked === m.id;
        return {
          ...m,
          on: on,
          off: !on,
          pick: () => this.setState({ picked: m.id })
        };
      })
    };
  }
}
</script>
</body>
</html>
