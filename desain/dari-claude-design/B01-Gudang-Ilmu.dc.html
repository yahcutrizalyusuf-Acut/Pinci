<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'math' };
  }
  renderVals() {
    const t = this.state.tab;
    return {
      isMath: t === 'math',
      isBI: t === 'bi',
      toMath: () => this.setState({ tab: 'math' }),
      toBI: () => this.setState({ tab: 'bi' })
    };
  }
}
</script>
