<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tebak Kata</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Andika:wght@400;700&display=swap">
<style>
body { margin: 0; }
a { color: #1F7A4D; } a:hover { color: #15502F; }
button { cursor: pointer; }
.pm-empuk { transition: transform 260ms cubic-bezier(.34,1.56,.64,1); }
.pm-empuk:active { transform: scale(0.9); }
@keyframes pm-mantul-a { 0% { transform: translateY(0); } 30% { transform: translateY(-28px); } 60% { transform: translateY(0); } 80% { transform: translateY(-6px); } 100% { transform: translateY(0); } }
@keyframes pm-mantul-b { 0% { transform: translateY(0); } 30% { transform: translateY(-28px); } 60% { transform: translateY(0); } 80% { transform: translateY(-6px); } 100% { transform: translateY(0); } }
.pm-mantul-a { animation: pm-mantul-a 400ms cubic-bezier(.34,1.56,.64,1) 1; }
.pm-mantul-b { animation: pm-mantul-b 400ms cubic-bezier(.34,1.56,.64,1) 1; }
@keyframes pm-masuk { 0% { transform: scale(0.4); } 100% { transform: scale(1); } }
.pm-masuk { animation: pm-masuk 300ms cubic-bezier(.34,1.56,.64,1) 1; }
@keyframes pm-mekar-a { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; } }
@keyframes pm-mekar-b { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; } }
.pm-mekar-a { animation: pm-mekar-a 450ms cubic-bezier(.2,.8,.3,1) 1 both; }
.pm-mekar-b { animation: pm-mekar-b 450ms cubic-bezier(.2,.8,.3,1) 1 both; }
@keyframes pm-terbang { 0% { transform: translate(-100px, 0); } 50% { transform: translate(180px, -18px); } 100% { transform: translate(470px, 0); } }
.pm-terbang { animation: pm-terbang 2.6s linear 1 both; }
@keyframes pm-lompat { 0% { transform: translate(0, 0) rotate(-35deg); opacity: 0; } 12% { opacity: 1; } 50% { transform: translate(70px, -130px) rotate(5deg); } 88% { opacity: 1; } 100% { transform: translate(140px, 0) rotate(45deg); opacity: 0; } }
.pm-lompat { animation: pm-lompat 1.6s cubic-bezier(.3,.6,.4,1) 1 both; }
@keyframes pm-bersin { 0% { transform: scale(0.6); opacity: 0; } 15% { transform: scale(1); opacity: 1; } 30% { transform: translateX(-5px) scale(1.06); } 42% { transform: translateX(0) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
.pm-bersin { animation: pm-bersin 2.4s ease-out 1 both; }
</style>
</helmet>
<div data-root="1" style="width: 360px; height: 800px; box-sizing: border-box; background: #FFF6E5; font-family: 'Andika', sans-serif; color: #2D3142; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="flex: none; height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #FFC98A;">
    <a href="G01-Waktu-Main.dc.html" aria-label="Kembali ke peta" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="#2D3142" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <span style="flex: 1; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px;">Tebak Kata</span>
    <svg width="64" height="40" viewBox="0 0 72 44" role="img" aria-label="Sore, waktu main hampir selesai">
      <path d="M6 40 A30 30 0 0 1 66 40" stroke="#FFF0D9" stroke-width="3" stroke-dasharray="3 5" fill="none" stroke-linecap="round"/>
      <circle cx="60" cy="32" r="9" fill="#FF8A3D" stroke="#E0631A" stroke-width="2"/>
    </svg>
  </div>

  <div style="flex: none; height: 220px; position: relative; background: #FFC98A; overflow: hidden;">
    <svg width="360" height="220" viewBox="0 0 360 220" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
      <circle cx="300" cy="150" r="40" fill="#FF9F5A" opacity="0.6"/>
      <path d="M0 170 Q90 130 180 160 T360 150 V220 H0 Z" fill="#E7B98A"/>
      <path d="M0 190 Q120 160 230 185 T360 180 V220 H0 Z" fill="#D9A46B"/>
      <circle cx="40" cy="120" r="24" fill="#5E9E6E"/><rect x="36" y="130" width="8" height="40" fill="#8A5A33"/>
    </svg>
    <div style="position: absolute; left: 50%; top: 24px; transform: translateX(-50%); width: 176px; height: 176px; border-radius: 32px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 rgba(45,49,66,0.12);">
      <svg width="132" height="124" viewBox="0 0 132 124" role="img" aria-label="Gambar baju">
        <path d="M44 10 L18 24 L4 52 L26 62 L32 50 V114 H100 V50 L106 62 L128 52 L114 24 L88 10 Q66 30 44 10 Z" fill="#4EA8DE" stroke="#2D3142" stroke-width="4" stroke-linejoin="round"/>
        <path d="M44 10 Q66 30 88 10" stroke="#2D3142" stroke-width="4" fill="none"/>
        <circle cx="66" cy="54" r="4" fill="#FFFFFF"/><circle cx="66" cy="72" r="4" fill="#FFFFFF"/><circle cx="66" cy="90" r="4" fill="#FFFFFF"/>
      </svg>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 18px 16px 24px; gap: 16px;">

    <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
      <button type="button" class="pm-empuk" aria-label="Dengarkan kata" style="width: 64px; height: 64px; border: none; border-radius: 50%; background: #3BB273; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #1F7A4D; flex: none;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#2D3142"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" stroke="#2D3142" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <sc-for list="{{ slots }}" as="sl" hint-placeholder-count="2">
        <sc-if value="{{ sl.filled }}" hint-placeholder-val="{{ false }}"><span class="pm-masuk" style="width: 96px; height: 80px; border-radius: 18px; background: #E4F4EB; border: 3px solid #2E9E5B; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700;">{{ sl.text }}</span></sc-if>
        <sc-if value="{{ sl.open }}" hint-placeholder-val="{{ true }}"><span style="width: 96px; height: 80px; border-radius: 18px; background: #FFFFFF; border: 3px dashed #C9B48F; box-sizing: border-box;"></span></sc-if>
      </sc-for>
    </div>

    <sc-if value="{{ showHint }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: #E8F4FC;">
        <svg width="44" height="44" viewBox="0 0 120 120" aria-hidden="true" style="flex: none;">
          <ellipse cx="34" cy="30" rx="15" ry="20" fill="#A0673A" stroke="#6B4423" stroke-width="4"/>
          <ellipse cx="86" cy="30" rx="15" ry="20" fill="#A0673A" stroke="#6B4423" stroke-width="4"/>
          <circle cx="60" cy="68" r="44" fill="#A0673A" stroke="#6B4423" stroke-width="4"/>
          <circle cx="46" cy="64" r="9" fill="#FFFFFF"/><circle cx="74" cy="64" r="9" fill="#FFFFFF"/>
          <circle cx="48" cy="66" r="4.5" fill="#2D3142"/><circle cx="76" cy="66" r="4.5" fill="#2D3142"/>
        </svg>
        <span style="font-size: 18px; line-height: 1.35;">Dengar pelan-pelan: <strong>ba… ju…</strong></span>
      </div>
    </sc-if>

    <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="text-align: center; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 36px; color: #1F7A4D;">Baju!</div>
        <a href="G07-Akhir-Babak.dc.html" style="height: 72px; border-radius: 18px; background: #3BB273; color: #2D3142; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px;">Lanjut</a>
      </div>
    </sc-if>

    <sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
        <sc-for list="{{ choices }}" as="c" hint-placeholder-count="3">
          <sc-if value="{{ c.bA }}" hint-placeholder-val="{{ false }}">
            <button type="button" class="pm-mantul-a" onClick="{{ c.pick }}" style="height: 96px; border: 3px solid #EDE3CF; border-radius: 22px; background: #FFFFFF; color: #2D3142; font-family: 'Andika', sans-serif; font-size: 40px; font-weight: 700; box-shadow: 0 4px 0 #EDE3CF;">{{ c.text }}</button>
          </sc-if>
          <sc-if value="{{ c.bB }}" hint-placeholder-val="{{ false }}">
            <button type="button" class="pm-mantul-b" onClick="{{ c.pick }}" style="height: 96px; border: 3px solid #EDE3CF; border-radius: 22px; background: #FFFFFF; color: #2D3142; font-family: 'Andika', sans-serif; font-size: 40px; font-weight: 700; box-shadow: 0 4px 0 #EDE3CF;">{{ c.text }}</button>
          </sc-if>
          <sc-if value="{{ c.still }}" hint-placeholder-val="{{ true }}">
            <button type="button" class="pm-empuk" onClick="{{ c.pick }}" style="height: 96px; border: 3px solid #EDE3CF; border-radius: 22px; background: #FFFFFF; color: #2D3142; font-family: 'Andika', sans-serif; font-size: 40px; font-weight: 700; box-shadow: 0 4px 0 #EDE3CF;">{{ c.text }}</button>
          </sc-if>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ popA }}" hint-placeholder-val="{{ false }}"><span class="pm-mekar-a" aria-hidden="true" style="position: absolute; left: {{ popX }}px; top: {{ popY }}px; width: 120px; height: 120px; pointer-events: none; z-index: 6;"><svg width="120" height="120" viewBox="0 0 120 120"><ellipse cx="60" cy="18" rx="7" ry="12" fill="#FF9F1C"/><ellipse cx="96" cy="40" rx="7" ry="12" fill="#E85D5D" transform="rotate(60 96 40)"/><ellipse cx="96" cy="82" rx="7" ry="12" fill="#FFC93C" transform="rotate(120 96 82)"/><ellipse cx="60" cy="102" rx="7" ry="12" fill="#3BB273"/><ellipse cx="24" cy="82" rx="7" ry="12" fill="#8E6CCF" transform="rotate(60 24 82)"/><ellipse cx="24" cy="40" rx="7" ry="12" fill="#FF6B6B" transform="rotate(120 24 40)"/></svg></span></sc-if>
  <sc-if value="{{ popB }}" hint-placeholder-val="{{ false }}"><span class="pm-mekar-b" aria-hidden="true" style="position: absolute; left: {{ popX }}px; top: {{ popY }}px; width: 120px; height: 120px; pointer-events: none; z-index: 6;"><svg width="120" height="120" viewBox="0 0 120 120"><ellipse cx="60" cy="18" rx="7" ry="12" fill="#FF9F1C"/><ellipse cx="96" cy="40" rx="7" ry="12" fill="#E85D5D" transform="rotate(60 96 40)"/><ellipse cx="96" cy="82" rx="7" ry="12" fill="#FFC93C" transform="rotate(120 96 82)"/><ellipse cx="60" cy="102" rx="7" ry="12" fill="#3BB273"/><ellipse cx="24" cy="82" rx="7" ry="12" fill="#8E6CCF" transform="rotate(60 24 82)"/><ellipse cx="24" cy="40" rx="7" ry="12" fill="#FF6B6B" transform="rotate(120 24 40)"/></svg></span></sc-if>

  <sc-if value="{{ isRangkong }}" hint-placeholder-val="{{ false }}">
    <div class="pm-terbang" aria-hidden="true" style="position: absolute; left: 0; top: 70px; pointer-events: none; z-index: 5;">
      <svg width="88" height="52" viewBox="0 0 88 52"><path d="M4 30 L16 26 L16 34 Z" fill="#FFFFFF" stroke="#2D3142" stroke-width="2"/><ellipse cx="34" cy="30" rx="20" ry="11" fill="#2D3142"/><path d="M26 26 Q34 4 50 18 Q40 22 34 28 Z" fill="#2D3142"/><path d="M28 34 Q36 40 46 34" stroke="#FFFFFF" stroke-width="3" fill="none"/><circle cx="56" cy="24" r="9" fill="#2D3142"/><circle cx="58" cy="22" r="2" fill="#FFFFFF"/><path d="M63 22 Q78 20 86 30 Q74 30 63 28 Z" fill="#FFC93C" stroke="#C99A00" stroke-width="1.5"/><path d="M60 16 Q72 10 80 20 Q70 18 62 20 Z" fill="#FF9F1C"/></svg>
    </div>
  </sc-if>
  <sc-if value="{{ isIkan }}" hint-placeholder-val="{{ false }}">
    <div class="pm-lompat" aria-hidden="true" style="position: absolute; left: 40px; bottom: 170px; pointer-events: none; z-index: 5;">
      <svg width="52" height="30" viewBox="0 0 52 30"><path d="M40 15 L52 4 L52 26 Z" fill="#2A86C6"/><ellipse cx="22" cy="15" rx="20" ry="11" fill="#4EA8DE" stroke="#2A86C6" stroke-width="2"/><circle cx="12" cy="12" r="2.5" fill="#2D3142"/><path d="M20 8 Q26 15 20 22" stroke="#FFFFFF" stroke-width="2" fill="none"/></svg>
    </div>
  </sc-if>
  <sc-if value="{{ isBersin }}" hint-placeholder-val="{{ false }}">
    <div class="pm-bersin" aria-hidden="true" style="position: absolute; right: 12px; bottom: 120px; display: flex; align-items: flex-end; gap: 4px; pointer-events: none; z-index: 5;">
      <span style="background: #FFFFFF; border-radius: 14px 14px 4px 14px; padding: 6px 10px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 18px; color: #2D3142; box-shadow: 0 2px 6px rgba(45,49,66,0.15);">Hatchi!</span>
      <svg width="56" height="56" viewBox="0 0 120 120"><ellipse cx="34" cy="30" rx="15" ry="20" fill="#A0673A" stroke="#6B4423" stroke-width="4"/><ellipse cx="86" cy="30" rx="15" ry="20" fill="#A0673A" stroke="#6B4423" stroke-width="4"/><circle cx="60" cy="68" r="44" fill="#A0673A" stroke="#6B4423" stroke-width="4"/><ellipse cx="60" cy="86" rx="28" ry="20" fill="#FFF6E5"/><path d="M38 58 L50 64 L38 70 M82 58 L70 64 L82 70" stroke="#6B4423" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="60" cy="92" rx="7" ry="6" fill="#6B4423"/></svg>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filled: [], bounce: null, n: 0, misses: 0 };
  }
  componentDidMount() {
    this.si = 0;
    this.firstT = setTimeout(() => this.surprise(), 3000);
    this.loopT = setInterval(() => this.surprise(), 15000);
  }
  componentWillUnmount() {
    clearTimeout(this.firstT);
    clearInterval(this.loopT);
    clearTimeout(this.hideT);
  }
  surprise() {
    const list = ['rangkong', 'bersin', 'ikan'];
    const k = list[this.si % 3];
    this.si += 1;
    this.setState({ surprise: k });
    clearTimeout(this.hideT);
    this.hideT = setTimeout(() => this.setState({ surprise: null }), 2800);
  }
  pop(e) {
    const t = e && e.currentTarget;
    const root = t && t.closest ? t.closest('[data-root]') : null;
    if (!root || !e.clientX) return;
    const r = root.getBoundingClientRect();
    const k = r.width / 360 || 1;
    this.setState({ popX: Math.round((e.clientX - r.left) / k), popY: Math.round((e.clientY - r.top) / k), popN: (this.state.popN || 0) + 1 });
  }
  renderVals() {
    const s = this.state;
    const word = ['ba', 'ju'];
    const done = s.filled.length === word.length;
    const expected = word[s.filled.length];
    return {
      done: done,
      popA: (s.popN || 0) > 0 && s.popN % 2 === 1,
      popB: (s.popN || 0) > 0 && s.popN % 2 === 0,
      popX: s.popX || 0,
      popY: s.popY || 0,
      isRangkong: s.surprise === 'rangkong',
      isBersin: s.surprise === 'bersin',
      isIkan: s.surprise === 'ikan',
      notDone: !done,
      showHint: s.misses >= 2 && !done,
      slots: word.map((w, i) => ({ filled: i < s.filled.length, open: i >= s.filled.length, text: s.filled[i] || '' })),
      choices: ['ba', 'ju', 'bu'].map((t) => {
        const b = s.bounce === t;
        return {
          text: t,
          bA: b && s.n % 2 === 0,
          bB: b && s.n % 2 === 1,
          still: !b,
          pick: (e) => {
            if (t === expected) {
              this.setState({ filled: s.filled.concat([t]), bounce: null });
              this.pop(e);
            } else {
              this.setState({ bounce: t, n: s.n + 1, misses: s.misses + 1 });
            }
          }
        };
      })
    };
  }
}
</script>
</body>
</html>
