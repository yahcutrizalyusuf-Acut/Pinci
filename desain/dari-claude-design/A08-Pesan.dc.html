<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pesan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Andika:wght@400;700&display=swap">
<style>
body { margin: 0; }
a { color: #1F7A4D; } a:hover { color: #15502F; }
button { cursor: pointer; }
</style>
</helmet>
<div style="width: 360px; height: 800px; box-sizing: border-box; background: #FFF6E5; font-family: 'Andika', sans-serif; color: #2D3142; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 64px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #F1E6CF;">
    <span style="width: 44px; height: 44px; border-radius: 50%; background: #E6F0FF; display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="#2A5DB0" stroke-width="2"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6" stroke="#2A5DB0" stroke-width="2" stroke-linecap="round"/></svg>
    </span>
    <div style="font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 24px;">Ayah</div>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px;">
    <div style="align-self: center; padding: 4px 12px; border-radius: 999px; background: #F1E9D8; font-size: 14px; color: #5B6072;">Hari ini</div>
    <div style="align-self: flex-start; max-width: 85%; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 20px 20px 20px 6px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(45,49,66,0.08);">
      <button type="button" aria-label="Dengarkan pesan Ayah" style="width: 44px; height: 44px; flex: none; border: none; border-radius: 50%; background: #E4F4EB; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#1F7A4D"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" stroke="#1F7A4D" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <span style="font-size: 18px; line-height: 1.35;">Ayah bangga kamu tidak menyerah di ×8</span>
    </div>
    <sc-for list="{{ sent }}" as="s" hint-placeholder-count="0">
      <div style="align-self: flex-end; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 14px; border-radius: 20px 20px 6px 20px; background: #E4F4EB;">
        <span style="font-size: 40px; line-height: 1;">{{ s.emoji }}</span>
        <span style="font-size: 15px;">{{ s.label }}</span>
      </div>
    </sc-for>
  </div>

  <div style="flex: none; background: #FFFFFF; border-top: 1px solid #F1E6CF; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 15px; color: #5B6072;">Balas dengan stiker</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{ stickers }}" as="k" hint-placeholder-count="6">
        <button type="button" onClick="{{ k.send }}" style="border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: 'Andika', sans-serif; color: #2D3142;">
          <span style="width: 64px; height: 64px; border-radius: 50%; background: #FFF6E5; border: 2px solid #F1E6CF; display: flex; align-items: center; justify-content: center; font-size: 30px;">{{ k.emoji }}</span>
          <span style="font-size: 14px; line-height: 1.2; text-align: center; min-height: 34px;">{{ k.label }}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Menu utama" style="height: 64px; flex: none; display: flex; background: #FFFFFF; border-top: 1px solid #F1E6CF;">
    <a href="A03-Beranda-Belajar.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" stroke="#6B6F80" stroke-width="2" stroke-linejoin="round"/></svg>
      <span style="font-size: 13px; color: #5B6072;">Belajar</span>
    </a>
    <a href="B01-Gudang-Ilmu.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 19.5V5a2 2 0 0 1 2-2h12v14H7a2 2 0 0 0-2 2.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19" stroke="#6B6F80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size: 13px; color: #5B6072;">Gudang Ilmu</span>
    </a>
    <a href="G01-Waktu-Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4" stroke="#6B6F80" stroke-width="2"/><circle cx="9" cy="9" r="1.4" fill="#6B6F80"/><circle cx="15" cy="15" r="1.4" fill="#6B6F80"/><circle cx="12" cy="12" r="1.4" fill="#6B6F80"/></svg>
      <span style="font-size: 13px; color: #5B6072;">Main</span>
    </a>
    <a href="A08-Pesan.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none;">
      <span style="padding: 2px 16px; border-radius: 999px; background: #D9F0E2; display: flex;"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="#1F7A4D"/></svg></span>
      <span style="font-size: 13px; color: #1F7A4D; font-weight: 700;">Pesan</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: [] };
  }
  renderVals() {
    const list = [
      { emoji: '🏅', label: 'Aku lulus level' },
      { emoji: '🚀', label: 'Lihat rekorku' },
      { emoji: '🙋', label: 'Bantu aku dong' },
      { emoji: '💚', label: 'Terima kasih' },
      { emoji: '😴', label: 'Aku capek hari ini' },
      { emoji: '💪', label: 'Ayo Tantang Ayah' }
    ];
    return {
      sent: this.state.sent,
      stickers: list.map((k) => ({
        ...k,
        send: () => this.setState({ sent: this.state.sent.concat([k]).slice(-3) })
      }))
    };
  }
}
</script>
</body>
</html>
