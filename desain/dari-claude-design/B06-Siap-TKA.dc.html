<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Siap TKA</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Andika:wght@400;700&display=swap">
<style>
body { margin: 0; }
a { color: #1F7A4D; } a:hover { color: #15502F; }
button { cursor: pointer; }
@keyframes pm-goyang { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.pm-goyang { animation: pm-goyang 0.3s ease-in-out 1; }
</style>
</helmet>
<div style="width: 360px; height: 800px; box-sizing: border-box; background: #FFF6E5; font-family: 'Andika', sans-serif; color: #2D3142; display: flex; flex-direction: column; padding: 12px 16px 24px; gap: 12px; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
    <a href="A07-Istirahat.dc.html" style="height: 44px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; text-decoration: none; color: #2D3142; font-size: 15px;">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#2D3142"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#2D3142"/></svg>
      Jeda
    </a>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="padding: 4px 10px; border-radius: 8px; background: #3A86FF; color: #FFFFFF; font-size: 13px; font-weight: 700; letter-spacing: 0.04em;">TKA</span>
      <span style="font-size: 15px; color: #2A5DB0; font-weight: 700;">Matematika</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px;">
    <div style="flex: 1; height: 12px; border-radius: 999px; background: #EDE3CF; overflow: hidden;" role="progressbar" aria-valuenow="3" aria-valuemin="0" aria-valuemax="10" aria-label="Soal 3 dari 10">
      <div style="width: 30%; height: 100%; border-radius: 999px; background: #3BB273;"></div>
    </div>
    <div style="font-size: 15px; font-weight: 700;">3 / 10</div>
  </div>

  <div style="background: #FFFFFF; border-radius: 20px; padding: 16px 18px; border-top: 6px solid #3A86FF; box-shadow: 0 2px 6px rgba(45,49,66,0.08);">
    <div style="font-size: 20px; line-height: 1.45;">Ibu membeli 3 kg beras. Harga 1 kg beras Rp12.500. Berapa yang harus Ibu bayar?</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{ options }}" as="o" hint-placeholder-count="4">
      <sc-if value="{{ o.right }}" hint-placeholder-val="{{ false }}">
        <button type="button" style="height: 56px; border: 3px solid #2E9E5B; border-radius: 16px; background: #E4F4EB; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-family: 'Andika', sans-serif; color: #2D3142; font-size: 18px; font-weight: 700;">
          <span style="width: 32px; height: 32px; border-radius: 50%; background: #2E9E5B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; flex: none;">✓</span>{{ o.text }}
        </button>
      </sc-if>
      <sc-if value="{{ o.wrong }}" hint-placeholder-val="{{ false }}">
        <button type="button" class="pm-goyang" onClick="{{ o.pick }}" style="height: 56px; border: 3px solid #FF6B6B; border-radius: 16px; background: #FFF0F0; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-family: 'Andika', sans-serif; color: #2D3142; font-size: 18px;">
          <span style="width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; border: 2px solid #FF6B6B; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex: none;">{{ o.letter }}</span>{{ o.text }}
        </button>
      </sc-if>
      <sc-if value="{{ o.plain }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ o.pick }}" style="height: 56px; border: 1px solid #EDE3CF; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-family: 'Andika', sans-serif; color: #2D3142; font-size: 18px; box-shadow: 0 2px 0 #EDE3CF;">
          <span style="width: 32px; height: 32px; border-radius: 50%; background: #E6F0FF; color: #2A5DB0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex: none;">{{ o.letter }}</span>{{ o.text }}
        </button>
      </sc-if>
    </sc-for>
  </div>

  <sc-if value="{{ gotWrong }}" hint-placeholder-val="{{ false }}">
    <div class="pm-goyang" style="padding: 12px 14px; border-radius: 16px; background: #FFF0F0; border: 2px solid #FF6B6B; font-size: 16px; line-height: 1.4;">Hampir! Jawabannya <strong>Rp37.500</strong>, karena 3 × 12.500 = 37.500.</div>
  </sc-if>
  <sc-if value="{{ gotRight }}" hint-placeholder-val="{{ false }}">
    <div style="padding: 12px 14px; border-radius: 16px; background: #E4F4EB; font-size: 16px;"><strong style="color: #1F7A4D;">Betul! ✓</strong> 3 × 12.500 = 37.500.</div>
  </sc-if>

  <sc-for list="{{ hints }}" as="h" hint-placeholder-count="0">
    <div style="display: flex; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #E8F4FC; font-size: 16px; line-height: 1.35;">
      <span style="font-weight: 700; flex: none;">{{ h.no }}.</span><span>{{ h.text }}</span>
    </div>
  </sc-for>

  <div style="flex: 1;"></div>
  <div style="display: flex; gap: 10px;">
    <sc-if value="{{ moreHints }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ nextHint }}" style="height: 56px; padding: 0 16px; border: 2px solid #4EA8DE; border-radius: 16px; background: #FFFFFF; color: #2D3142; font-family: 'Andika', sans-serif; font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 6px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.9V16h5v-.2c0-.8.4-1.5 1-1.9A6 6 0 0 0 12 3z" stroke="#2D3142" stroke-width="2" stroke-linejoin="round"/></svg>
        Petunjuk {{ hintLabel }}
      </button>
    </sc-if>
    <a href="A06-Akhir-Lembar.dc.html" style="flex: 1; height: 56px; border-radius: 16px; background: #3BB273; color: #2D3142; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px;">Soal berikutnya</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null, hint: 0 };
  }
  renderVals() {
    const s = this.state;
    const answered = s.picked !== null;
    const correct = 'B';
    const all = [
      'Berapa kali Rp12.500 harus dijumlahkan?',
      'Pecah dulu: 3 × 12.000 dan 3 × 500.',
      '36.000 + 1.500 = …'
    ];
    const opts = [
      { letter: 'A', text: 'Rp35.000' },
      { letter: 'B', text: 'Rp37.500' },
      { letter: 'C', text: 'Rp36.500' },
      { letter: 'D', text: 'Rp38.500' }
    ];
    return {
      options: opts.map((o) => ({
        ...o,
        right: answered && o.letter === correct,
        wrong: answered && s.picked === o.letter && o.letter !== correct,
        plain: !answered || (o.letter !== correct && s.picked !== o.letter),
        pick: () => this.setState({ picked: o.letter })
      })),
      gotRight: s.picked === correct,
      gotWrong: answered && s.picked !== correct,
      hints: all.slice(0, s.hint).map((t, i) => ({ no: i + 1, text: t })),
      moreHints: s.hint < 3,
      hintLabel: (s.hint + 1) + '/3',
      nextHint: () => this.setState({ hint: Math.min(3, s.hint + 1) })
    };
  }
}
</script>
</body>
</html>
