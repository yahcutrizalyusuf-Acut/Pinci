<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Unit Bahasa Inggris — hewan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Andika:wght@400;700&display=swap">
<style>
body { margin: 0; }
a { color: #1F7A4D; } a:hover { color: #15502F; }
button { cursor: pointer; }
@keyframes pm-goyang { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.pm-goyang { animation: pm-goyang 0.3s ease-in-out 1; }
</style>
</helmet>
<div style="width: 360px; height: 800px; box-sizing: border-box; background: #FFF6E5; font-family: 'Andika', sans-serif; color: #2D3142; display: flex; flex-direction: column; padding: 12px 16px 24px; gap: 14px; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 8px; height: 48px;">
    <a href="B04-Inggris-Tingkat.dc.html" aria-label="Kembali" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #FFFFFF; flex: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="#2D3142" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div style="display: flex; flex-direction: column;">
      <span style="font-size: 14px; color: #6A4BA8; font-weight: 700;">Tingkat 3 · Unit 1</span>
      <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.1;">Hewan di sekitar kita</h1>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="height: 8px; border-radius: 999px; background: #8E6CCF;"></div>
      <span style="font-size: 13px; color: #5B6072; text-align: center;">Kenal kata</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <sc-if value="{{ isListen }}" hint-placeholder-val="{{ false }}"><div style="height: 8px; border-radius: 999px; background: #8E6CCF;"></div></sc-if>
      <sc-if value="{{ isLearn }}" hint-placeholder-val="{{ true }}"><div style="height: 8px; border-radius: 999px; background: #E7DDC9;"></div></sc-if>
      <span style="font-size: 13px; color: #5B6072; text-align: center;">Dengar lalu pilih</span>
    </div>
  </div>

  <sc-if value="{{ isLearn }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <sc-for list="{{ words }}" as="w" hint-placeholder-count="3">
        <div style="height: 104px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; gap: 16px; padding: 0 16px; box-shadow: 0 2px 6px rgba(45,49,66,0.08);">
          <span style="width: 76px; height: 76px; border-radius: 20px; background: #F1ECFA; display: flex; align-items: center; justify-content: center; font-size: 46px; flex: none;">{{ w.emoji }}</span>
          <span style="flex: 1; display: flex; flex-direction: column;">
            <span lang="en" style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1;">{{ w.en }}</span>
            <span style="font-size: 16px; color: #5B6072;">{{ w.id }}</span>
          </span>
          <button type="button" aria-label="Dengarkan {{ w.en }}" style="width: 52px; height: 52px; flex: none; border: none; border-radius: 50%; background: #8E6CCF; display: flex; align-items: center; justify-content: center;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#FFFFFF"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ isListen }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
      <button type="button" aria-label="Dengarkan kata" style="width: 112px; height: 112px; border: none; border-radius: 50%; background: #8E6CCF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #6A4BA8;">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#FFFFFF"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div style="font-size: 20px; text-align: center;">Dengar, lalu pilih gambarnya.</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-self: stretch;">
        <sc-for list="{{ choices }}" as="c" hint-placeholder-count="3">
          <sc-if value="{{ c.right }}" hint-placeholder-val="{{ false }}">
            <button type="button" style="height: 112px; border: 4px solid #2E9E5B; border-radius: 24px; background: #E4F4EB; font-size: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: 'Andika', sans-serif; color: #1F7A4D;"><span>{{ c.emoji }}</span><span style="font-size: 18px; font-weight: 700;">✓</span></button>
          </sc-if>
          <sc-if value="{{ c.wrong }}" hint-placeholder-val="{{ false }}">
            <button type="button" class="pm-goyang" onClick="{{ c.pick }}" style="height: 112px; border: 3px solid #FF6B6B; border-radius: 24px; background: #FFF0F0; font-size: 52px;">{{ c.emoji }}</button>
          </sc-if>
          <sc-if value="{{ c.plain }}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{ c.pick }}" aria-label="{{ c.label }}" style="height: 112px; border: 2px solid #E2D8F3; border-radius: 24px; background: #FFFFFF; font-size: 52px;">{{ c.emoji }}</button>
          </sc-if>
        </sc-for>
      </div>
      <sc-if value="{{ gotRight }}" hint-placeholder-val="{{ false }}">
        <div style="align-self: stretch; padding: 14px 16px; border-radius: 16px; background: #E4F4EB; font-size: 18px;"><strong style="color: #1F7A4D;">Betul! ✓</strong> <span lang="en">dog</span> = anjing.</div>
      </sc-if>
      <sc-if value="{{ gotWrong }}" hint-placeholder-val="{{ false }}">
        <div class="pm-goyang" style="align-self: stretch; padding: 14px 16px; border-radius: 16px; background: #FFF0F0; border: 2px solid #FF6B6B; font-size: 18px; line-height: 1.4;">Hampir! Yang tadi <strong lang="en">dog</strong>, si anjing. Dengar sekali lagi, yuk.</div>
      </sc-if>
    </div>
  </sc-if>

  <div style="flex: 1;"></div>
  <sc-if value="{{ isLearn }}" hint-placeholder-val="{{ true }}">
    <button type="button" onClick="{{ toListen }}" style="height: 64px; border: none; border-radius: 16px; background: #3BB273; color: #2D3142; font-family: 'Andika', sans-serif; font-weight: 700; font-size: 20px; box-shadow: 0 2px 6px rgba(45,49,66,0.12);">Lanjut: dengar lalu pilih</button>
  </sc-if>
  <sc-if value="{{ isListen }}" hint-placeholder-val="{{ false }}">
    <a href="A06-Akhir-Lembar.dc.html" style="height: 64px; border-radius: 16px; background: #3BB273; color: #2D3142; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; box-shadow: 0 2px 6px rgba(45,49,66,0.12);">Soal berikutnya</a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'learn', picked: null };
  }
  renderVals() {
    const s = this.state;
    const answered = s.picked !== null;
    const target = 'dog';
    const pics = [
      { key: 'cat', emoji: '🐱', label: 'Kucing' },
      { key: 'dog', emoji: '🐶', label: 'Anjing' },
      { key: 'bird', emoji: '🐦', label: 'Burung' }
    ];
    return {
      isLearn: s.phase === 'learn',
      isListen: s.phase === 'listen',
      toListen: () => this.setState({ phase: 'listen', picked: null }),
      words: [
        { en: 'cat', id: 'kucing', emoji: '🐱' },
        { en: 'dog', id: 'anjing', emoji: '🐶' },
        { en: 'bird', id: 'burung', emoji: '🐦' }
      ],
      gotRight: s.picked === target,
      gotWrong: answered && s.picked !== target,
      choices: pics.map((p) => ({
        ...p,
        right: answered && p.key === target,
        wrong: answered && s.picked === p.key && p.key !== target,
        plain: !answered || (p.key !== target && s.picked !== p.key),
        pick: () => this.setState({ picked: p.key })
      }))
    };
  }
}
</script>
</body>
</html>
