<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Bahasa Inggris — pilih tingkat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Andika:wght@400;700&display=swap">
<style>
body { margin: 0; }
a { color: #1F7A4D; } a:hover { color: #15502F; }
button { cursor: pointer; }
</style>
</helmet>
<div style="width: 360px; height: 800px; box-sizing: border-box; background: #FFF6E5; font-family: 'Andika', sans-serif; color: #2D3142; display: flex; flex-direction: column; padding: 12px 16px 24px; gap: 14px; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 8px; height: 48px;">
    <a href="A03-Beranda-Belajar.dc.html" aria-label="Kembali" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #FFFFFF; flex: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="#2D3142" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px;">Bahasa Inggris</h1>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 10px;">
    <svg width="80" height="80" viewBox="0 0 120 120" role="img" aria-label="Pinci senang" style="flex: none;">
      <ellipse cx="30" cy="28" rx="16" ry="22" fill="#A0673A" stroke="#6B4423" stroke-width="3"/>
      <ellipse cx="90" cy="28" rx="16" ry="22" fill="#A0673A" stroke="#6B4423" stroke-width="3"/>
      <ellipse cx="30" cy="30" rx="8" ry="12" fill="#FFF6E5"/>
      <ellipse cx="90" cy="30" rx="8" ry="12" fill="#FFF6E5"/>
      <circle cx="60" cy="68" r="46" fill="#A0673A" stroke="#6B4423" stroke-width="3"/>
      <ellipse cx="60" cy="86" rx="30" ry="22" fill="#FFF6E5"/>
      <circle cx="46" cy="64" r="11" fill="#FFFFFF" stroke="#6B4423" stroke-width="2"/>
      <circle cx="74" cy="64" r="11" fill="#FFFFFF" stroke="#6B4423" stroke-width="2"/>
      <circle cx="48" cy="66" r="5" fill="#2D3142"/>
      <circle cx="76" cy="66" r="5" fill="#2D3142"/>
      <ellipse cx="60" cy="82" rx="5" ry="4" fill="#6B4423"/>
      <path d="M48 92 Q60 102 72 92" stroke="#6B4423" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <div style="flex: 1; background: #FFFFFF; border-radius: 20px 20px 20px 6px; padding: 12px 14px; box-shadow: 0 2px 6px rgba(45,49,66,0.08); font-size: 18px; line-height: 1.35;">Pinci menyarankan <strong style="color: #6A4BA8;">Tingkat 3</strong>. Kamu boleh pilih yang lain.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <sc-for list="{{ levels }}" as="l" hint-placeholder-count="4">
      <sc-if value="{{ l.on }}" hint-placeholder-val="{{ false }}">
        <button type="button" aria-pressed="true" style="height: 88px; border: 4px solid #8E6CCF; border-radius: 24px; background: #F1ECFA; display: flex; align-items: center; gap: 14px; padding: 0 16px; text-align: left; font-family: 'Andika', sans-serif; color: #2D3142;">
          <span style="width: 52px; height: 52px; border-radius: 16px; background: #8E6CCF; color: #FFFFFF; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px; display: flex; align-items: center; justify-content: center; flex: none;">{{ l.n }}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.1;">Tingkat {{ l.n }}</span>
            <span style="font-size: 15px; color: #5B6072;">{{ l.desc }}</span>
          </span>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#8E6CCF"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </sc-if>
      <sc-if value="{{ l.off }}" hint-placeholder-val="{{ true }}">
        <button type="button" aria-pressed="false" onClick="{{ l.pick }}" style="height: 88px; border: 2px solid #E2D8F3; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; gap: 14px; padding: 0 16px; text-align: left; font-family: 'Andika', sans-serif; color: #2D3142;">
          <span style="width: 52px; height: 52px; border-radius: 16px; background: #F1ECFA; color: #6A4BA8; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px; display: flex; align-items: center; justify-content: center; flex: none;">{{ l.n }}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.1;">Tingkat {{ l.n }}</span>
            <span style="font-size: 15px; color: #5B6072;">{{ l.desc }}</span>
          </span>
          <sc-if value="{{ l.suggested }}" hint-placeholder-val="{{ false }}"><span style="padding: 3px 8px; border-radius: 999px; background: #FF9F1C; color: #2D3142; font-size: 12px; font-weight: 700;">Saran</span></sc-if>
        </button>
      </sc-if>
    </sc-for>
  </div>

  <div style="flex: 1;"></div>
  <a href="B05-Inggris-Unit.dc.html" style="height: 64px; border-radius: 16px; background: #3BB273; color: #2D3142; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; box-shadow: 0 2px 6px rgba(45,49,66,0.12);">Mulai Tingkat {{ picked }}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 3 };
  }
  renderVals() {
    const p = this.state.picked;
    const list = [
      { n: 3, desc: 'Kenal kata sehari-hari' },
      { n: 4, desc: 'Kalimat pendek' },
      { n: 5, desc: 'Cerita pendek' },
      { n: 6, desc: 'Percakapan sederhana' }
    ];
    return {
      picked: p,
      levels: list.map((l) => ({
        ...l,
        on: l.n === p,
        off: l.n !== p,
        suggested: l.n === 3,
        pick: () => this.setState({ picked: l.n })
      }))
    };
  }
}
</script>
</body>
</html>
