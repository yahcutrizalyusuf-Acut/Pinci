<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Baca Ulang</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Andika:wght@400;700&display=swap">
<style>
body { margin: 0; }
a { color: #1F7A4D; } a:hover { color: #15502F; }
button { cursor: pointer; }
</style>
</helmet>
<div style="width: 360px; height: 800px; box-sizing: border-box; background: #FFF6E5; font-family: 'Andika', sans-serif; color: #2D3142; display: flex; flex-direction: column; padding: 12px 16px 24px; gap: 14px; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 8px; height: 48px;">
    <a href="A03-Beranda-Belajar.dc.html" aria-label="Kembali" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #FFFFFF; flex: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="#2D3142" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div style="display: flex; flex-direction: column;">
      <span style="font-size: 14px; color: #B03C3C; font-weight: 700;">Baca Ulang</span>
      <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.1;">Pinci dan Penyu Kecil</h1>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; background: #FFFFFF; border-radius: 24px; padding: 20px; box-shadow: 0 2px 6px rgba(45,49,66,0.08); overflow-y: auto;">
    <div style="display: flex; flex-wrap: wrap; gap: 6px 7px; font-size: 22px; line-height: 1.5;">
      <sc-for list="{{ words }}" as="w" hint-placeholder-count="40">
        <sc-if value="{{ w.on }}" hint-placeholder-val="{{ false }}"><span style="background: #FFE29A; border-radius: 6px; padding: 0 3px; margin: 0 -3px; font-weight: 700;">{{ w.t }}</span></sc-if>
        <sc-if value="{{ w.off }}" hint-placeholder-val="{{ true }}"><span>{{ w.t }}</span></sc-if>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 16px; background: #E8F4FC;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#2D3142"/><path d="M16 9a4 4 0 0 1 0 6" stroke="#2D3142" stroke-width="2" stroke-linecap="round"/></svg>
    <span style="font-size: 16px;">Dengarkan, lalu baca ikut kata yang kuning.</span>
  </div>

  <div style="display: flex; gap: 12px;">
    <button type="button" onClick="{{ start }}" style="flex: 1; height: 64px; border: none; border-radius: 16px; background: #3BB273; color: #2D3142; font-family: 'Andika', sans-serif; font-weight: 700; font-size: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 6px rgba(45,49,66,0.12);">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z" fill="#2D3142"/></svg>
      Mulai
    </button>
    <a href="A06-Akhir-Lembar.dc.html" style="flex: 1; height: 64px; box-sizing: border-box; border: 2px solid #3BB273; border-radius: 16px; background: #FFFFFF; color: #1F7A4D; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px;">Selesai</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 3 };
    this.timer = null;
    this.text = 'Pinci berjalan ke tepi sungai. Ia melihat penyu kecil tersangkut di antara batu. Pinci mendorong batu itu pelan-pelan. Penyu pun bebas dan berenang lagi. "Terima kasih, Pinci!" kata penyu sambil tersenyum.';
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  start() {
    if (this.timer) clearInterval(this.timer);
    const total = this.text.split(' ').length;
    this.setState({ idx: 0 });
    this.timer = setInterval(() => {
      const n = this.state.idx + 1;
      if (n >= total) {
        clearInterval(this.timer);
        this.timer = null;
        this.setState({ idx: -1 });
      } else {
        this.setState({ idx: n });
      }
    }, 450);
  }
  renderVals() {
    const idx = this.state.idx;
    return {
      words: this.text.split(' ').map((t, i) => ({ t: t, on: i === idx, off: i !== idx })),
      start: () => this.start()
    };
  }
}
</script>
</body>
</html>
