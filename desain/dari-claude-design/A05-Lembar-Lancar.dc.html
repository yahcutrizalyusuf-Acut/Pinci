<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Lembar Lancar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Andika:wght@400;700&display=swap">
<style>
body { margin: 0; }
a { color: #1F7A4D; } a:hover { color: #15502F; }
button { cursor: pointer; }
</style>
</helmet>
<div style="width: 360px; height: 800px; box-sizing: border-box; background: #FFF6E5; font-family: 'Andika', sans-serif; color: #2D3142; display: flex; flex-direction: column; padding: 12px 16px 20px; gap: 12px; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
    <a href="A07-Istirahat.dc.html" style="height: 44px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; text-decoration: none; color: #2D3142; font-size: 16px;">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#2D3142"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#2D3142"/></svg>
      Jeda
    </a>
    <button type="button" style="height: 44px; padding: 0 14px; border: none; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; color: #2D3142; font-family: 'Andika', sans-serif; font-size: 16px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.9V16h5v-.2c0-.8.4-1.5 1-1.9A6 6 0 0 0 12 3z" stroke="#2D3142" stroke-width="2" stroke-linejoin="round"/></svg>
      Petunjuk
    </button>
  </div>

  <div style="display: flex; align-items: center; gap: 12px;">
    <div style="flex: 1; height: 14px; border-radius: 999px; background: #EDE3CF; overflow: hidden;" role="progressbar" aria-valuenow="7" aria-valuemin="0" aria-valuemax="20" aria-label="Soal 7 dari 20">
      <div style="width: 35%; height: 100%; border-radius: 999px; background: #3BB273;"></div>
    </div>
    <div style="font-size: 16px; font-weight: 700;">7 / 20</div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; position: relative;">
    <div style="font-size: 56px; line-height: 1; letter-spacing: 0.02em;">7 × 8 =</div>
    <div style="min-width: 150px; height: 88px; padding: 0 20px; box-sizing: border-box; border-radius: 20px; background: #FFFFFF; border: 3px solid #3BB273; display: flex; align-items: center; justify-content: center; font-size: 56px; line-height: 1;">
      <sc-if value="{{ hasAnswer }}" hint-placeholder-val="{{ false }}">{{ answer }}</sc-if>
      <sc-if value="{{ noAnswer }}" hint-placeholder-val="{{ true }}"><span style="color: #C9C0AE;">?</span></sc-if>
    </div>
    <svg width="48" height="48" viewBox="0 0 120 120" role="img" aria-label="Pinci menemani" style="position: absolute; right: 0; bottom: 0;">
      <ellipse cx="34" cy="30" rx="15" ry="20" fill="#A0673A" stroke="#6B4423" stroke-width="4"/>
      <ellipse cx="86" cy="30" rx="15" ry="20" fill="#A0673A" stroke="#6B4423" stroke-width="4"/>
      <circle cx="60" cy="68" r="44" fill="#A0673A" stroke="#6B4423" stroke-width="4"/>
      <circle cx="46" cy="64" r="9" fill="#FFFFFF"/>
      <circle cx="74" cy="64" r="9" fill="#FFFFFF"/>
      <circle cx="48" cy="66" r="4.5" fill="#2D3142"/>
      <circle cx="76" cy="66" r="4.5" fill="#2D3142"/>
    </svg>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
    <sc-for list="{{ digits }}" as="d" hint-placeholder-count="9">
      <button type="button" onClick="{{ d.press }}" style="height: 64px; border: 1px solid #EDE3CF; border-radius: 16px; background: #FFFFFF; color: #2D3142; font-family: 'Andika', sans-serif; font-size: 30px; box-shadow: 0 2px 0 #EDE3CF;">{{ d.label }}</button>
    </sc-for>
    <button type="button" onClick="{{ backspace }}" aria-label="Hapus" style="height: 64px; border: none; border-radius: 16px; background: #F1E9D8; color: #2D3142; font-family: 'Andika', sans-serif; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 6px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5h11v14H9l-6-7z" stroke="#2D3142" stroke-width="2" stroke-linejoin="round"/><path d="M12 9l5 6M17 9l-5 6" stroke="#2D3142" stroke-width="2" stroke-linecap="round"/></svg>
      Hapus
    </button>
    <button type="button" onClick="{{ pressZero }}" style="height: 64px; border: 1px solid #EDE3CF; border-radius: 16px; background: #FFFFFF; color: #2D3142; font-family: 'Andika', sans-serif; font-size: 30px; box-shadow: 0 2px 0 #EDE3CF;">0</button>
    <a href="A06-Akhir-Lembar.dc.html" style="height: 64px; border-radius: 16px; background: #3BB273; color: #2D3142; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 18px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#2D3142" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Cek
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { answer: '' };
  }
  push(n) {
    const a = this.state.answer;
    if (a.length >= 3) return;
    this.setState({ answer: a + n });
  }
  renderVals() {
    const answer = this.state.answer;
    const digits = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => ({
      label: String(n),
      press: () => this.push(String(n))
    }));
    return {
      answer: answer,
      hasAnswer: answer.length > 0,
      noAnswer: answer.length === 0,
      digits: digits,
      pressZero: () => this.push('0'),
      backspace: () => this.setState({ answer: answer.slice(0, -1) })
    };
  }
}
</script>
</body>
</html>
